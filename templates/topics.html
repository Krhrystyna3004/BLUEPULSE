{% extends "base.html" %}{% block content %}<section class="page-intro"><span class="eyebrow">ОБИРАЙ СВОЄ</span><h1>Теми, що тебе <em>надихають.</em></h1><p>Підписуйся на цікаві напрями та збирай персональну стрічку.</p></section><div class="topic-grid">{% for t in topics %}<a class="topic-card" href="{{ url_for('topic_page',topic_id=t.id) }}"><span class="topic-symbol">{{ ['✧','◉','⌁','✺','♧','↗'][loop.index0%6] }}</span><h3>{{ t.name }}</h3><p>{{ t.description }}</p><span class="text-link">Переглянути →</span></a>{% endfor %}</div>{% endblock %}
