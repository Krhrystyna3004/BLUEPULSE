{% extends "base.html" %}{% block content %}<div class="form-wrap"><span class="eyebrow">НОВА СПІЛЬНОТА</span><h1>Створи свою <em>групу.</em></h1><form method="post" class="form-card"><label>Назва групи<input name="name" required maxlength="100" placeholder="Наприклад, Дизайн без меж"></label><label>Опис<textarea name="description" rows="4" maxlength="500" placeholder="Про що ваша спільнота?"></textarea></label><label>Тема<select name="topic_id"><option value="">Без теми</option>{% for t in topics %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="is_public" checked> Відкрита група — її бачать усі</label><button class="button">Створити групу</button></form></div>{% endblock %}
